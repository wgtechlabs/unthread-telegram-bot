name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  # Weekly CI + CodeQL sweep so security analysis keeps running when the repo is
  # quiet. Scheduled runs never publish artifacts or cut releases (see the
  # enable-container/enable-release gates below).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: build-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flow:
    # Scoped to the union of permissions requested by the called workflow's jobs
    # (container/release need contents+packages write, codeql needs security-events).
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@v0.2.0
    secrets: inherit
    with:
      ci-profile: node-bun
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bunx biome check . --reporter=github
      ci-typecheck-command: bun run type-check
      ci-test-command: bun run test
      ci-coverage-command: bun run test:coverage
      ci-build-command: bun run build
      # CI_MATRIX_VERSION is exported by the called CI workflow for each matrix
      # entry, so the smoke build validates the Node version actually under test.
      ci-docker-smoke-command: |
        docker build --build-arg NODE_VERSION="${CI_MATRIX_VERSION}-alpine" -t test-build .
        docker image rm test-build
      ci-matrix-versions: '["22","24","26"]'
      codeql-build-mode: none
      enable-package: false
      enable-container: ${{ github.event_name != 'schedule' }}
      enable-release: ${{ github.event_name != 'schedule' }}
      container-registry: both
      # Container tag lifecycle (owned by build flow v0.2, see docs in README):
      # - push to main    -> staging-<sha> plus the floating staging tag
      # - push to dev     -> dev-<sha> plus the floating dev tag
      # - published release -> <version>, <major>.<minor>, <major>, and latest
      # `latest` therefore only moves on releases; consumers that need the tip of
      # main should pull :staging or a SHA-pinned tag.
      container-floating-tags: true
      container-release-platforms: linux/amd64
